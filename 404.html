<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden | SlimService</title>
<meta name="description" content="Deze pagina bestaat niet of is verplaatst.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png">
<meta name="theme-color" content="#07060A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#07060A;--surface:#111019;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#F0EEF8;--muted:#6B6880;--faint:rgba(240,238,248,.55);--g:#00FF88;--g-dim:rgba(0,255,136,.08);--g-ring:rgba(0,255,136,.22);--f-d:'Syne',system-ui,sans-serif;--f-m:'DM Mono','Courier New',monospace;--r:4px;--r-md:12px;--ease:cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-d);background:var(--void);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--g);text-decoration:none;border-bottom:1px solid var(--g-ring);transition:color .15s var(--ease)}
a:hover,a:focus{color:var(--text);outline:none}
a:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:2px}
.wrap{max-width:800px;margin:0 auto;padding:0 20px;width:100%}
@media(min-width:600px){.wrap{padding:0 clamp(20px,4vw,40px)}}
.header{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:700;font-size:18px;color:var(--text);border:none}
.brand:focus-visible{outline:2px solid var(--g);outline-offset:4px;border-radius:4px}
.brand-icon{width:32px;height:32px;background:var(--g);border-radius:var(--r);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--void);flex-shrink:0}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 0;text-align:center}
.content{max-width:480px}
.error-code{font-family:var(--f-m);font-size:clamp(80px,20vw,140px);font-weight:400;color:var(--g);line-height:1;margin-bottom:16px;letter-spacing:-.02em}
.error-title{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px;line-height:1.2}
.error-text{font-size:15px;color:var(--faint);margin-bottom:32px;line-height:1.7}
.btn-home{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:var(--g);border:none;border-radius:var(--r-md);font-family:var(--f-d);font-size:15px;font-weight:700;color:var(--void);cursor:pointer;transition:all .2s var(--ease);text-decoration:none}
.btn-home:hover,.btn-home:focus{background:var(--text);color:var(--void);transform:translateY(-2px)}
.btn-home:focus-visible{outline:2px solid var(--g);outline-offset:4px}
.btn-home svg{width:18px;height:18px}
.links{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.links-title{font-family:var(--f-m);font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:16px;text-transform:uppercase}
.links-list{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 24px}
.links-list a{font-size:14px;color:var(--faint);padding:4px 0}
.links-list a:hover{color:var(--g)}
.footer{border-top:1px solid var(--line);padding:20px 0;text-align:center}
.footer-text{font-family:var(--f-m);font-size:11px;color:var(--muted);letter-spacing:.04em}
.footer-text a{color:var(--g);margin:0 4px}
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <a href="/" class="brand" aria-label="SlimService homepage">
      <span class="brand-icon" aria-hidden="true">SS</span>
      <span>SlimService</span>
    </a>
  </header>
</div>

<main class="main">
  <div class="wrap">
    <div class="content">
      <div class="error-code" aria-hidden="true">404</div>
      <h1 class="error-title">Pagina niet gevonden</h1>
      <p class="error-text">De pagina die je zoekt bestaat niet of is verplaatst. Controleer de URL of ga terug naar de homepage.</p>
      
      <a href="/" class="btn-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Naar homepage
      </a>

      <div class="links">
        <div class="links-title">Misschien zoek je</div>
        <div class="links-list">
          <a href="/voorwaarden.html">Voorwaarden</a>
          <a href="/privacy.html">Privacy</a>
          <a href="/dpa.html">DPA</a>
          <a href="/cookies.html">Cookies</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <p class="footer-text">© 2026 SlimService · <a href="mailto:hello@slimservice.nl">hello@slimservice.nl</a></p>
  </div>
</footer>

</body>
</html>
